[package]
name = "rusty-app"
description = "Rusty's desktop app for Omarchy: a QML shell with native agent terminals, built with cxx-qt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rusty"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
dirs = "6"
notify = "6"
toml = "0.9"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
