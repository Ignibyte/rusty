# Rusty: one key to bring the app forward, launching it when it is not running.
# Append to ~/.config/hypr/bindings.conf (Omarchy reads it), then `hyprctl reload`.
# SUPER+ALT+R is free in stock Omarchy and clear of the reminder keys on SUPER+CTRL+R;
# change it if you have bound it.
bindd = SUPER ALT, R, Rusty, exec, omarchy-launch-or-focus rusty
