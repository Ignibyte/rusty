# Rusty: one key to bring the app forward, launching it when it is not running.
# Append to ~/.config/hypr/bindings.conf (Omarchy reads it), then `hyprctl reload`.
# SUPER+ALT+R is free in stock Omarchy and clear of the reminder keys on SUPER+CTRL+R;
# change it if you have bound it. The pattern is anchored to the app's own class, because
# a bare `rusty` also matches a browser tab titled after the repository. The launch goes
# through `rusty-session up`, so the app runs under its user service.
bindd = SUPER ALT, R, Rusty, exec, omarchy-launch-or-focus '^(rusty|com\.ignibyte\.rusty)$' 'rusty-session up'
